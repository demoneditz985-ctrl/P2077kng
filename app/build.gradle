plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.shadow.injector'
    compileSdk 34

    defaultConfig {
        applicationId "com.shadow.injector"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // The two shipped libraries are arm64 only.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        // REQUIRED: keeps libmain.so / libRootMagisk.so uncompressed in the APK so they are
        // extracted to nativeLibraryDir at install time. Without this we cannot copy them out.
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
